# Railway config for the BACKEND API (web) service.
# Service settings → Root Directory: backend
# Service settings → Config-as-code path: backend/railway.web.toml
#
# Start command comes from the Dockerfile CMD (uvicorn on $PORT).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
