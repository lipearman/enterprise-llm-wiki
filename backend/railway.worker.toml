# Railway config for the BACKGROUND WORKER service.
# Shares the backend image; only the start command differs (no HTTP, no healthcheck).
# Service settings → Root Directory: backend
# Service settings → Config-as-code path: backend/railway.worker.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m app.jobs.worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
