# Railway config for the FRONTEND (Next.js) service.
# Service settings → Root Directory: frontend
#
# IMPORTANT: NEXT_PUBLIC_API_BASE_URL is baked in at BUILD time. Set it as a
# service variable BEFORE the first deploy (the Dockerfile reads it as a build
# ARG). Point it at the public backend URL, e.g. https://<backend>.up.railway.app

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
